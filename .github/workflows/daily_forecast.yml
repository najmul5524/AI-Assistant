name: Daily Market Forecast & Illustrated PDF

on:
  schedule:
    # 16:00 UTC corresponds to 22:00 (10:00 PM) Bangladesh Time (Asia/Dhaka UTC+6)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger button from GitHub Actions tab

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Dispatch Daily Forecast PDF to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFAULT_TIMEZONE: 'Asia/Dhaka'
        run: |
          python send_daily_forecast_telegram.py
