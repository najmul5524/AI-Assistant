name: Daily Forex Calendar Sync

on:
  schedule:
    # Runs every day at 00:30 UTC (which is 06:30 AM Bangladesh Time / Asia/Dhaka)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI button anytime

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-oauthlib python-dotenv

      - name: Run Forex Calendar Sync & Send Telegram Alert
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          DEFAULT_TIMEZONE: 'Asia/Dhaka'
          FOREX_MIN_IMPACT: 'Medium'
          FOREX_CURRENCIES: 'USD,EUR,GBP,JPY,AUD,CAD,CHF,NZD'
          FOREX_REMINDER_MINUTES: '15'
        run: |
          python sync_daily_forex.py

